name: Bug report
description: Report a reproducible problem with the overlay, runner or docs
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **请勿附上 Nikon 固件、密钥、boot ROM、flash/RAM dump、解密模块或
        可刷写镜像。** 也不要粘贴未脱敏的绝对路径、序列号、用户照片或完整
        `session.json`。

        **Do not attach Nikon firmware, keys, boot ROM, flash/RAM dumps,
        decrypted modules or flashable images.** Do not paste unredacted absolute
        paths, serial numbers, personal photos or full `session.json`.

  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 实际结果与预期结果 / actual vs expected
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: 复现命令 / Reproduction
      description: 使用的 `tools/run.py` 或 QEMU 命令（路径可替换为 `$FW`、`$QEMU`）
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: commit、QEMU 版本、CPU/主机 / commit, QEMU version, host
      placeholder: "80278fb, QEMU 11.1.0, WSL Ubuntu"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志 / Sanitized logs
      description: 只保留相关摘录；不要包含固件内容或个人信息
      render: text
    validations:
      required: false

  - type: checkboxes
    id: legal
    attributes:
      label: 合规确认 / Compliance
      options:
        - label: 我确认以上内容不含固件、密钥、dump、改后镜像或个人信息
          required: true
        - label: 我已阅读 SECURITY.md（安全问题不走公开 issue）
          required: true
